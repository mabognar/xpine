[package]
name = "xpine"
version = "0.2.0"
edition = "2024"
license = "MIT"
keywords = ["email", "client", "terminal"]
categories = ["email"]
description = "Terminal email client. Easy-to-use, modern features. Tested with MacOS & Linux."
readme = true
repository = "https://github.com/mabognar/xpine"

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
chrono = "0.4"
crossterm = "0.29"
dirs = "6.0"
imap = "2.4"
include_dir = "0.7"
lettre = "0.11"
mailparse = "0.16"
native-tls = "0.2"
reqwest = { version = "0.12", features = ["blocking", "json"] }
ropey = "1.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syntect = { version = "5.2", default-features = false, features = ["default-fancy"] }
toml = "0.8"
webbrowser = "1.0"
rand = "0.8.5"
urlencoding = "2.1.3"

[profile.release]
lto = true
codegen-units = 1
strip = true

[package.metadata.deb]
maintainer = "Matt Bognar <mattbognar@gmail.com>"
copyright = "2024-2026, Matthew Bognar"
license-file = ["LICENSE", "4"]
depends = "$auto"
extended-description = """
Terminal email client. Easy-to-use, modern features. Tested with MacOS & Linux.
"""
section = "utility"
priority = "optional"

